<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de solicitudes</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <nav class="navbar">
    <div class="nav-brand">
      <i data-lucide="layers"></i>
      <span>Sistema gestiones</span>
    </div>
    
    <ul class="nav-links">
      <li>
        <button class="nav-btn active" data-target="clientes">
          <i data-lucide="users"></i>
          <span>Clientes</span>
        </button>
      </li>
      <li>
        <button class="nav-btn" data-target="solicitudes">
          <i data-lucide="file-text"></i>
          <span>Solicitudes</span>
        </button>
      </li>
      <li>
        <button class="nav-btn" data-target="gestiones">
          <i data-lucide="check-square"></i>
          <span>Gestiones</span>
        </button>
      </li>
    </ul>
  </nav>

  <main class="container">
    <!--================================  SECCION DE CLIENTES -================================ -->
    <section id="clientes" class="content-section active">
      <h2>Módulo de Clientes</h2>

      <div class="card-form">
        <h3 id="form-title">Guardar / Editar Cliente</h3>
        <form id="form-cliente">
          <input type="hidden" id="cliente-id">
          
          <div class="form-grid">
            <div class="form-group">
              <label for="identificacion">DPI</label>
              <input type="text" id="identificacion" required placeholder="Ej. 12345678">
            </div>

            <div class="form-group">
              <label for="nombre">Nombre Completo</label>
              <input type="text" id="nombre" required placeholder="Ej. Juan Pérez">
            </div>

            <div class="form-group">
              <label for="edad">Edad</label>
              <input type="number" id="edad" required min="1" max="120" placeholder="Ej. 30">
            </div>

            <div class="form-group">
              <label for="direccion">Dirección</label>
              <input type="text" id="direccion" required placeholder="Ej. Av. Central #123">
            </div>
          </div>

          <div class="form-actions">
            <button type="button" class="btn-secondary" id="btn-limpiar">Limpiar</button>
            <button type="submit" class="btn-primary" id="btn-guardar">Guardar</button>
          </div>
        </form>
      </div>

      <!-- Listado (Siempre visible) -->
      <div class="table-container">
        <h3>Listado de Clientes</h3>
        <table class="data-table">
          <thead>
            <tr>
              <th>Identificación</th>
              <th>Nombre</th>
              <th>Edad</th>
              <th>Dirección</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-clientes-body">
            <!-- Cargado por JS -->
          </tbody>
        </table>
      </div>
    </section>
    
    <!--================================  SECCION DE CLIENTES -================================ -->

    <section id="solicitudes" class="content-section">
      <h2>Módulo de Solicitudes</h2>
      <p>Aquí irá la tabla y formulario de solicitudes.</p>
    </section>

    <section id="gestiones" class="content-section">
      <h2>Módulo de Gestiones</h2>
      <p>Aquí irá la tabla y formulario de gestiones.</p>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    // Inicializar iconos de Lucide
    lucide.createIcons();
  </script>
</body>
</html>
